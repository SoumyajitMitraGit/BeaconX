<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeaconX Split-Screen Prototype</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h2>BeaconX Live Sync Prototype</h2>
        <span id="connection-status">🟡 Connecting...</span>
    </div>
    
    <div class="split-container">
        <!-- Client 1 -->
        <div class="client-window">
            <h3>Client A (Soumyajit)</h3>
            <div class="whatsapp-container">
                <div id="chat-log-1" class="chat-window"></div>
                <input type="text" id="chat-input-1" class="chat-input" placeholder="Type a message... (Press Enter)">
            </div>
        </div>

        <!-- Client 2 -->
        <div class="client-window">
            <h3>Client B (Ahin)</h3>
            <div class="whatsapp-container">
                <div id="chat-log-2" class="chat-window"></div>
                <input type="text" id="chat-input-2" class="chat-input" placeholder="Type a message... (Press Enter)">
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
