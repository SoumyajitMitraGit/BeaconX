<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeaconX Split-Screen Prototype</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
</head>
<body>
    <div class="header">
        <h2>BeaconX Live Sync Prototype</h2>
        <span id="connection-status">🟡 Connecting...</span>
    </div>
    
    <div class="split-container">
        <!-- Client 1 -->
        <div class="client-window">
            <h3>Client A (Soumyajit)</h3>
            <div id="editor-1"></div>
        </div>

        <!-- Client 2 -->
        <div class="client-window">
            <h3>Client B (Ahin)</h3>
            <div id="editor-2"></div>
        </div>
    </div>

    <!-- 1. Base Quill Editor -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    
    <!-- 2. NEW: Quill Cursors Plugin for live floating name tags -->
    <script src="https://cdn.jsdelivr.net/npm/quill-cursors@3.1.0/dist/quill-cursors.min.js"></script>
    
    <!-- 3. Main Application Logic -->
    <script type="module" src="app.js"></script>
</body>
</html>
