<body>
    <div class="header">
        <h2>BeaconX Live Sync Prototype</h2>
        <span id="connection-status">🟡 Connecting...</span>
    </div>
    
    <div class="split-container">
        <!-- Client 1 -->
        <div class="client-window">
            <h3>Client A (Soumyajit)</h3>
            <div id="editor-1"></div>
            <!-- NEW: Activity Log for Client 1 -->
            <div class="chat-container">
                <div id="chat-log-1" class="chat-log"></div>
                <input type="text" id="chat-input-1" class="chat-input" placeholder="Stamp a message in the log... (Press Enter)">
            </div>
        </div>

        <!-- Client 2 -->
        <div class="client-window">
            <h3>Client B (Ahin)</h3>
            <div id="editor-2"></div>
            <!-- NEW: Activity Log for Client 2 -->
            <div class="chat-container">
                <div id="chat-log-2" class="chat-log"></div>
                <input type="text" id="chat-input-2" class="chat-input" placeholder="Stamp a message in the log... (Press Enter)">
            </div>
        </div>
    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quill-cursors@3.1.0/dist/quill-cursors.min.js"></script>
    <script type="module" src="app.js"></script>
</body>
