<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeaconX Live Sync</title>
    
    <!-- Premium Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/quill-cursors@3.1.0/dist/quill-cursors.css" rel="stylesheet">
</head>
<body>
    <div class="header">
        <h2>BeaconX Live Sync</h2>
        <span id="connection-status">Connecting...</span>
    </div>
    
    <div class="split-container">
        <div class="client-window">
            <h3>Client A</h3>
            <div id="editor-1"></div>
        </div>

        <div class="client-window">
            <h3>Client B</h3>
            <div id="editor-2"></div>
        </div>
    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quill-cursors@3.1.0/dist/quill-cursors.min.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
